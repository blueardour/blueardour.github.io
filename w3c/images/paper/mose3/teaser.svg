<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">MoSE3 pipeline overview</title>
  <desc id="desc">Monocular RGB video goes through a frozen pi-cubed geometry backbone and a trainable tracking branch, producing 3D point tracks and rigidity embeddings. A differentiable weighted Horn fit turns them into a per-pixel SE(3) field; clustering the embeddings yields object and part poses.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf8; }
      .panel { fill: #ffffff; stroke: #e3d9d0; stroke-width: 1.5; }
      .panel-accent { fill: #fbf3f1; stroke: #d9b6b2; stroke-width: 1.5; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #2a2421; letter-spacing: -0.4px; }
      .subtitle { font-size: 14px; fill: #7a706b; }
      .box-title { font-size: 16px; font-weight: 700; fill: #2a2421; }
      .box-sub { font-size: 12.5px; fill: #7a706b; }
      .tiny { font-size: 11px; fill: #9a8f88; }
      .accent { fill: #a95f5f; }
      .green { fill: #3f7d5a; }
      .blue { fill: #2f6f9f; }
      .arrow { stroke: #b7aaa0; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .frame { fill: #f6f1ec; stroke: #d8cbc0; stroke-width: 1; }
      .frame-inner { fill: #e9ded4; }
      .chip { fill: #f8eeee; stroke: #d9b6b2; stroke-width: 1; }
      .chip-text { font-size: 11.5px; fill: #864646; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b7aaa0"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4a3a2e" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="440" rx="14"/>
  <text class="label title" x="40" y="48">MoSE3: dense SE(3) from monocular video</text>
  <text class="label subtitle" x="40" y="72">Tracks + rigidity embeddings → differentiable weighted Horn fit → per-pixel SE(3)</text>

  <!-- Input video -->
  <g filter="url(#shadow)">
    <rect class="panel" x="40" y="110" width="190" height="250" rx="10"/>
    <text class="label box-title" x="60" y="140">Monocular RGB video</text>
    <text class="label box-sub" x="60" y="160">N frames + query frame q</text>
    <g transform="translate(60,182)">
      <rect class="frame" width="150" height="78" rx="5"/>
      <rect class="frame-inner" x="10" y="10" width="56" height="58" rx="3"/>
      <rect class="frame-inner" x="75" y="10" width="56" height="58" rx="3"/>
      <text class="label tiny" x="10" y="70">frame q</text>
      <text class="label tiny" x="75" y="70">frame i</text>
    </g>
    <text class="label box-sub" x="60" y="286">No depth sensor</text>
    <text class="label box-sub" x="60" y="304">No CAD model</text>
    <text class="label box-sub" x="60" y="322">No category prior</text>
  </g>

  <path class="arrow" d="M238 235 L282 235"/>

  <!-- Model -->
  <g filter="url(#shadow)">
    <rect class="panel" x="290" y="110" width="330" height="250" rx="10"/>
    <text class="label box-title" x="310" y="140">π³ geometry + tracking branch</text>
    <rect class="panel-accent" x="310" y="156" width="135" height="62" rx="7"/>
    <text class="label box-sub" x="322" y="180" style="fill:#864646;font-weight:700;">π³ geometry</text>
    <text class="label tiny" x="322" y="199">frozen</text>
    <rect class="panel-accent" x="465" y="156" width="135" height="62" rx="7"/>
    <text class="label box-sub" x="477" y="180" style="fill:#864646;font-weight:700;">Tracking branch</text>
    <text class="label tiny" x="477" y="199">trainable</text>

    <rect x="310" y="238" width="140" height="88" rx="7" fill="#f4f7f4" stroke="#cfdccf" stroke-width="1.2"/>
    <text class="label box-sub" x="323" y="261" style="fill:#3f6b4b;font-weight:700;">3D point tracks</text>
    <text class="label tiny" x="323" y="280">Xᵂᵢ(u), visibility</text>
    <text class="label tiny" x="323" y="298">per query pixel</text>
    <text class="label tiny" x="323" y="316">world-frame</text>

    <rect x="462" y="238" width="138" height="88" rx="7" fill="#f2f6fa" stroke="#cbd8e4" stroke-width="1.2"/>
    <text class="label box-sub" x="475" y="261" style="fill:#2f5f86;font-weight:700;">Rigidity embeddings</text>
    <text class="label tiny" x="475" y="280">Eᵢ(u), L2-normalized</text>
    <text class="label tiny" x="475" y="298">cosine similarity</text>
    <text class="label tiny" x="475" y="316">= soft rigid groups</text>
  </g>

  <path class="arrow" d="M628 235 L672 235"/>

  <!-- SE3 -->
  <g filter="url(#shadow)">
    <rect class="panel" x="680" y="110" width="230" height="250" rx="10"/>
    <text class="label box-title" x="700" y="140">Weighted Horn fit</text>
    <text class="label box-sub" x="700" y="160">closed form · differentiable</text>
    <rect x="700" y="180" width="190" height="60" rx="7" fill="#fbf3f1" stroke="#d9b6b2" stroke-width="1.2"/>
    <text class="label box-sub" x="714" y="204" style="fill:#864646;font-weight:700;">T(q→i)(u) ∈ SE(3)</text>
    <text class="label tiny" x="714" y="223">rotation + translation</text>
    <text class="label tiny" x="700" y="270">weights from embedding</text>
    <text class="label tiny" x="700" y="288">similarity, then Procrustes</text>
    <text class="label tiny" x="700" y="306">→ gradients flow to tracks</text>
    <text class="label tiny" x="700" y="324">and embeddings</text>
  </g>

  <path class="arrow" d="M918 235 L962 235"/>

  <!-- Outputs -->
  <g filter="url(#shadow)">
    <rect class="panel" x="970" y="110" width="190" height="250" rx="10"/>
    <text class="label box-title" x="990" y="140">Dense outputs</text>
    <rect x="990" y="158" width="150" height="58" rx="7" fill="#f2f6fa" stroke="#cbd8e4" stroke-width="1.2"/>
    <text class="label box-sub" x="1002" y="181" style="fill:#2f5f86;font-weight:700;">Per-pixel SE(3)</text>
    <text class="label tiny" x="1002" y="200">field over all frames</text>
    <rect x="990" y="230" width="150" height="58" rx="7" fill="#f4f7f4" stroke="#cfdccf" stroke-width="1.2"/>
    <text class="label box-sub" x="1002" y="253" style="fill:#3f6b4b;font-weight:700;">Object / part poses</text>
    <text class="label tiny" x="1002" y="272">cluster embeddings</text>
    <text class="label tiny" x="990" y="318">no CAD · no depth</text>
    <text class="label tiny" x="990" y="336">no per-video optimization</text>
  </g>

  <g transform="translate(40,388)">
    <rect class="chip" width="255" height="28" rx="14"/>
    <text class="label chip-text" x="14" y="19">Paper claim: first feed-forward dense SE(3)</text>
    <rect class="chip" x="270" width="208" height="28" rx="14"/>
    <text class="label chip-text" x="284" y="19">World frame, up to scale</text>
    <rect class="chip" x="492" width="230" height="28" rx="14"/>
    <text class="label chip-text" x="506" y="19">Tracks + grouping, not direct regression</text>
  </g>
</svg>
